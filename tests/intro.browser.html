<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch recovery check</title>
<link rel="stylesheet" href="/space-motion.css?v=10.33.7">
<style>body{background:#161a24;color:white;font:18px system-ui;margin:0}main{padding:32px}#ccSpaceIntro{height:100dvh}</style>
<script>
const options=new URLSearchParams(location.search);
if(options.get('renderer')!=='pwa'){
  window.CommandCentreNative={privacyLock:true};
  window.CommandCentreIntroSessionManaged=true;
  if(options.get('privacy')!=='unknown')window.CommandCentrePrivacyState={locked:options.get('privacy')==='locked'};
  // Deliberately reproduce a failed native canvas and missing animation frames.
  HTMLCanvasElement.prototype.getContext=()=>{throw Error('Native canvas unavailable')};
  requestAnimationFrame=()=>1;
}
</script>
<script src="/space-motion.js?v=10.33.7"></script>
<div id="ccSpaceIntro" role="dialog" aria-modal="true" aria-labelledby="ccSpaceTitle" aria-hidden="true">
  <canvas id="ccSpaceCanvas" aria-hidden="true"></canvas>
  <div id="ccSpaceStars" aria-hidden="true"><span class="cc-star-layer"></span><span class="cc-star-layer"></span><span class="cc-star-layer"></span></div>
  <div class="cc-space-brand"><div class="cc-space-monogram">cc</div><p class="cc-space-eyebrow">Your personal universe</p><h1 id="ccSpaceTitle" class="cc-space-title">Command Centre</h1><p class="cc-space-caption">Everything, within reach.</p></div>
  <div class="cc-space-footer"><div class="cc-space-progress"><span id="ccSpaceProgress"></span></div><button id="ccSkipIntro">Skip intro</button></div>
</div>
<main><h1>Home ready</h1><p id="result">Waiting for automatic exit</p><button id="replay">Replay animation</button><button id="unlock">Unlock</button></main>
<script>
addEventListener('cc-intro-complete',()=>document.getElementById('result').textContent='Automatic exit complete');
document.getElementById('replay').onclick=()=>CCSpaceMotion.replay();
document.getElementById('unlock').onclick=()=>dispatchEvent(new CustomEvent('cc-native-privacy-status',{detail:{locked:false}}));
</script>
