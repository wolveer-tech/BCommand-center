<script>
const accounting=new URLSearchParams(location.search).get('subject')==='accounting';
const lesson='Water moves from a dilute solution to a concentrated solution through a partially permeable membrane. This is osmosis. Animal cells may swell and burst in a dilute solution. Plant cell walls resist expansion and help prevent bursting.';
const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLbtAAAAABJRU5ErkJggg==';
const state={noteAccountOwner:'practice-fixture:'+new URLSearchParams(location.search).get('provider'),schoolbookProvider:new URLSearchParams(location.search).get('provider')||'openai',qwenKey:'sk-disposable-fixture-only',qwenModel:'qwen3.7-plus',deepSeekKey:'disposable-fixture-not-a-real-key',notes:[{id:'biology',kind:'schoolbook',title:'A-level Biology',subject:'Cells and transport',pages:[{id:'p1',title:'Osmosis',body:'<p>'+lesson+'</p><img src="'+pixel+'">'},{id:'p2',title:'Active transport',body:'<p>Active transport uses energy from respiration to move substances against their concentration gradient. Carrier proteins transfer substances across the membrane.</p>'}]},{id:'private-other-book',kind:'schoolbook',title:'Unrelated Chemistry',pages:[{id:'chem',title:'Do not send this page',body:'<p>UNRELATED_PRIVATE_BOOK_CONTENT must never enter the chosen Biology request.</p>'}]}]};
if(accounting)Object.assign(state.notes[0],{title:'Accounting',subject:'Double entry and cash accounts',pages:[{id:'p1',title:'Cash ledger',body:'<p>Cash increases are debits and cash decreases are credits. Debit entries go on the left; credit entries on the right. Owner investment and cash sales increase cash. Rent paid reduces cash.</p>'}]});
const before=JSON.stringify(state.notes);let generated=false,failNext=new URLSearchParams(location.search).has('fail'),slowNext=new URLSearchParams(location.search).has('slow');
const originalFetch=window.fetch.bind(window);window.fetch=async(url,init)=>{
 if(url==='/api/accounts/practice/status')return Response.json({provider:'OpenAI',configured:true});
 const openai=url.startsWith('/api/accounts/practice/');
 if(!openai&&url!=='https://api.deepseek.com/chat/completions')return originalFetch(url,init);
 const body=JSON.parse(init.body),isMark=openai?url.endsWith('/mark'):body.messages[0].content.includes('practice marker');
 if(init.signal.aborted)throw new DOMException('Aborted','AbortError');
 if(failNext){failNext=false;return Response.json({error:'Test failure'},{status:503})}
 if(slowNext){slowNext=false;await new Promise((resolve,reject)=>{init.signal.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})})}
 if(!isMark&&JSON.stringify(body).includes('UNRELATED_PRIVATE_BOOK_CONTENT'))throw Error('Unselected book leaked.');
 if(isMark&&openai)return Response.json({awarded:body.question.points.map((_,i)=>i===1?0:1),feedback:'You have explained the main idea. Add a precise link to the principle in the book.',improvements:['Make the missing step explicit.']});
 if(isMark)return Response.json({choices:[{finish_reason:'stop',message:{content:JSON.stringify({awarded:[1,0,1],feedback:'You correctly linked water movement to concentration. Make the role of the partially permeable membrane explicit.',improvements:['Explain why only certain substances can cross the membrane.']})}}]});
 generated=true;
 if(openai){
  const selected=body.source.pages.find(p=>p.images.length)||body.source.pages[0],quote=selected.text||'Readable label from the selected lesson picture.',format=body.options.format;
  const bank=Array.from({length:10},(_,i)=>{
   const type=format==='mixed'?(i===0&&accounting?'t-account':i%2?'written':'multiple-choice'):format==='journal-entry'?'written':format;
   const ledger={account:'Cash',currency:'GBP',entries:[{label:'Owner investment',side:'debit',amount:500},{label:'Cash sales',side:'debit',amount:120},{label:'Rent paid',side:'credit',amount:80}]};
   return {type,question:type==='t-account'?'Prepare the Cash account. Sort these transactions into the correct side: Owner investment £500; Cash sales £120; Rent paid £80. Task '+(i+1):type==='written'?(accounting?'In a short paragraph, explain why owner investment and rent affect opposite sides of the Cash account. Show how £500 + £120 − £80 gives the closing cash amount.':'In a short paragraph, explain what happens to an animal cell in a concentrated solution and why. Refer to the membrane and concentration difference.')+' Task '+(i+1):(accounting?'Which statement about recording cash is correct?':'Which statement about osmosis is correct?')+' Task '+(i+1),difficulty:3,skill:'Apply',points:type==='multiple-choice'?['Choose the supported statement']:type==='t-account'?[]:['Describe the effect','Explain the principle','Connect evidence to the conclusion'],options:type==='multiple-choice'?(accounting?['Cash increases are debits','Cash increases are credits','Rent paid increases cash','Cash sales reduce cash']:['Water moves from dilute to concentrated solution','Water always moves into cells','Osmosis always uses energy','Water cannot cross a membrane']):[],correctIndex:type==='multiple-choice'?0:null,optionExplanations:type==='multiple-choice'?['Correct: this follows the stated principle.','This reverses the relationship.','This contradicts the lesson.','This is not supported by the selected page.']:[],ledger:type==='t-account'?ledger:null,modelAnswer:type==='t-account'?'Debit: Owner investment 500; Cash sales 120. Credit: Rent paid 80. Cash remaining = 540.':accounting?'Cash increases are debits, while cash decreases are credits. Investment and sales increase cash, and rent reduces it. 500 + 120 − 80 = 540 GBP.':'Water moves out of the cell by osmosis through a partially permeable membrane because the external solution is more concentrated. The cell shrinks.',hint:'Use the principle on the selected source page.',sources:[{page:selected.number,quote}]};
  });return Response.json({questions:bank});
 }

 const prompts=['A red blood cell is placed in a concentrated salt solution. Explain what happens and why.','Predict how a plant cell responds in a dilute solution and justify your reasoning.','Compare the effect of a dilute solution on animal and plant cells.','Explain why the partially permeable membrane is essential to osmosis.','Evaluate the claim that all cells burst when placed in pure water.','Apply the principle of osmosis to explain water movement into a root cell.','Explain the direction of net water movement across a cell membrane.','Suggest why a cell loses water after the external solution becomes more concentrated.','Connect the role of the cell wall to the observed behaviour of plant cells.','Justify a prediction about a cell placed in a solution of equal concentration.'];
 return Response.json({choices:[{finish_reason:'stop',message:{content:JSON.stringify({questions:prompts.map((question,i)=>({question,difficulty:[3,2,4,3,5,3,2,4,3,1][i],skill:['Apply','Explain','Compare'][i%3],points:['Identify the direction of net water movement','Explain the role of the partially permeable membrane','Link the effect to the concentration difference or cell wall'],modelAnswer:'Water leaves the cell by osmosis through its partially permeable membrane because the external solution is more concentrated. The cell loses water and shrinks.',hint:'Compare the solutions on either side of the membrane, then consider which direction water moves.',sources:[{page:1,quote:'Water moves from a dilute solution to a concentrated solution through a partially permeable membrane.'}]}))})}}]});
};
function openSettings(){document.getElementById('testSummary').textContent='AI settings opened. No real key is used in this fixture.'}
function openNote(id){document.getElementById('noteModal').classList.add('open')}
const CommandCentreNotebooks={goToPage(index){document.getElementById('openedPage').textContent=state.notes[0].pages[index].title}};
if(document.getElementById('closeSource'))document.getElementById('closeSource').onclick=()=>document.getElementById('noteModal').classList.remove('open');
window.addEventListener('pagehide',()=>{if(JSON.stringify(state.notes)!==before)throw Error('Source book was changed.')});
</script>
