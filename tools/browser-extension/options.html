<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Command Centre Transfer settings</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Connect your browser</h1><p>On a paired device, open Transfers → Devices → Pair a device.</p><label>Command Centre site URL<input id="url" type="url" placeholder="https://your-site.workers.dev"></label><label>Browser name<input id="name" value="My browser" maxlength="60"></label><label>One-use pairing code<input id="code" autocomplete="off" spellcheck="false"></label><button id="connect">Connect browser</button><p id="status" role="status"></p><hr><label>Send to<select id="recipient"><option value="all">All other devices</option></select></label><label>Delete after<select id="ttl"><option value="3600">1 hour</option><option value="86400" selected>1 day</option><option value="604800">7 days</option><option value="0">Never</option></select></label><button id="save">Save preferences</button></main><script type="module" src="options.js"></script></body></html>
