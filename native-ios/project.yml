name: CommandCentreNative
options:
  bundleIdPrefix: tech.wolveer
  deploymentTarget:
    iOS: "26.0"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest

targets:
  CommandCentreNative:
    type: application
    platform: iOS
    sources:
      - path: CommandCentreNative
      - path: Shared
      - path: NativeShared
    dependencies:
      - package: WebRTC
      - target: BroadcastUploadExtension
      - target: CommandCentreWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolveer.commandcentre.native
        PRODUCT_NAME: Command Centre
        MARKETING_VERSION: 1.10.0
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommandCentreNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCentreNative/CommandCentreNative.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO

  BroadcastUploadExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastUploadExtension
      - path: Shared
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolveer.commandcentre.native.broadcast
        PRODUCT_NAME: Command Centre Mirror
        MARKETING_VERSION: 1.10.0
        CURRENT_PROJECT_VERSION: 16
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES

  CommandCentreWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CommandCentreWidgets
      - path: NativeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolveer.commandcentre.native.widgets
        PRODUCT_NAME: Command Centre Widgets
        MARKETING_VERSION: 1.10.0
        CURRENT_PROJECT_VERSION: 16
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommandCentreWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCentreWidgets/CommandCentreWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
