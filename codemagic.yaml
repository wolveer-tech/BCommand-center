workflows:
  ios-26-signulous-ipa:
    name: Command Centre iOS 1.12.1 Widgets and Live Activities
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR/native-ios"
          xcodegen generate

      - name: Resolve Swift packages
        script: |
          set -e
          cd "$CM_BUILD_DIR/native-ios"
          xcodebuild \
            -resolvePackageDependencies \
            -project CommandCentreNative.xcodeproj \
            -scheme CommandCentreNative

      - name: Build unsigned device app
        script: |
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          cd "$CM_BUILD_DIR/native-ios"

          set +e
          xcodebuild build \
            -project CommandCentreNative.xcodeproj \
            -scheme CommandCentreNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$CM_BUILD_DIR/build/xcodebuild-device.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "=== Compiler diagnostics ==="
            grep -n -E 'error:|warning:' "$CM_BUILD_DIR/build/xcodebuild-device.log" | tail -n 180 || true
            exit "$BUILD_STATUS"
          fi

      - name: Prepare and ad-hoc sign IPA structure
        script: |
          set -euo pipefail

          BUILD_ROOT="$CM_BUILD_DIR/build"
          PRODUCTS="$BUILD_ROOT/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi

          echo "App bundle: $APP_PATH"

          APPEX_PATHS=("$APP_PATH"/PlugIns/*.appex)
          if [ "${#APPEX_PATHS[@]}" -ne 2 ]; then
            echo "ERROR: Expected the ReplayKit and Widget extensions; found ${#APPEX_PATHS[@]}."
            exit 1
          fi

          BROADCAST_APPEX_PATH=""
          WIDGET_APPEX_PATH=""
          for appex in "${APPEX_PATHS[@]}"; do
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")
            case "$bundle_id" in
              *.broadcast) BROADCAST_APPEX_PATH="$appex" ;;
              *.widgets) WIDGET_APPEX_PATH="$appex" ;;
            esac
          done
          if [ -z "$BROADCAST_APPEX_PATH" ] || [ -z "$WIDGET_APPEX_PATH" ]; then
            echo "ERROR: Could not identify both embedded extensions."
            exit 1
          fi
          echo "ReplayKit extension: $BROADCAST_APPEX_PATH"
          echo "Widget extension: $WIDGET_APPEX_PATH"

          # Remove anything left over from an earlier signing/export attempt.
          find "$APP_PATH" -name '_CodeSignature' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name 'embedded.mobileprovision' -type f -delete 2>/dev/null || true

          # Ad-hoc sign nested Mach-O code first. This produces a structurally
          # coherent IPA for a re-signing service; it is NOT an installable
          # Apple signature by itself.
          while IFS= read -r -d '' framework; do
            echo "Ad-hoc signing framework: $framework"
            /usr/bin/codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$APP_PATH" -type d -name '*.framework' -print0)

          while IFS= read -r -d '' dylib; do
            echo "Ad-hoc signing dylib: $dylib"
            /usr/bin/codesign --force --sign - --timestamp=none "$dylib"
          done < <(find "$APP_PATH" -type f -name '*.dylib' -print0)

          # Sign both extensions before the containing app. The widget extension
          # carries the same App Group entitlement as the containing app.
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$BROADCAST_APPEX_PATH"

          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements "$CM_BUILD_DIR/native-ios/CommandCentreWidgets/CommandCentreWidgets.entitlements" \
            "$WIDGET_APPEX_PATH"

          # Sign the containing app last.
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements "$CM_BUILD_DIR/native-ios/CommandCentreNative/CommandCentreNative.entitlements" \
            "$APP_PATH"

          echo "=== Bundle identifiers ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          for appex in "${APPEX_PATHS[@]}"; do /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist"; done

          echo "=== Package types ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP_PATH/Info.plist"
          for appex in "${APPEX_PATHS[@]}"; do /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$appex/Info.plist"; done
          echo "=== Version consistency ==="
          APP_SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          echo "App version: $APP_SHORT ($APP_BUILD)"
          for appex in "${APPEX_PATHS[@]}"; do
            EXT_SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$appex/Info.plist")
            EXT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$appex/Info.plist")
            EXT_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")
            echo "Extension $(basename "$appex"): $EXT_SHORT ($EXT_BUILD), executable $EXT_EXEC"
            if [ "$APP_SHORT" != "$EXT_SHORT" ] || [ "$APP_BUILD" != "$EXT_BUILD" ] || [ -z "$EXT_EXEC" ]; then
              echo "ERROR: Extension version or executable is invalid."
              exit 1
            fi
          done

          echo "=== Extension points ==="
          for appex in "${APPEX_PATHS[@]}"; do
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist"
          done

          echo "=== Verify ad-hoc code structure ==="
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH"

          # Copy into a clean Payload directory after verification.
          rm -rf "$BUILD_ROOT/Payload"
          mkdir -p "$BUILD_ROOT/Payload"
          /usr/bin/ditto "$APP_PATH" "$BUILD_ROOT/Payload/$(basename "$APP_PATH")"

          # Produce a useful report to inspect if a signing service rejects it.
          {
            echo "Command Centre Signulous IPA structure report"
            echo "Generated: $(date -u)"
            echo
            echo "APP=$(basename "$APP_PATH")"
            echo "APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "APP_PACKAGE_TYPE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP_PATH/Info.plist")"
            for appex in "${APPEX_PATHS[@]}"; do
              echo "APPEX=$(basename "$appex")"
              echo "APPEX_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
              echo "APPEX_PACKAGE_TYPE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$appex/Info.plist")"
              echo "APPEX_EXTENSION_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")"
            done
            echo
            echo "Nested bundles:"
            find "$APP_PATH" -type d \( -name '*.framework' -o -name '*.appex' \) -print
            echo
            echo "Code signature verification:"
            /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1
          } > "$BUILD_ROOT/ipa-structure-report.txt"

      - name: Package IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/build"

          rm -f CommandCentre-iOS26-v1.12.1.ipa

          # ditto preserves bundle metadata and executable permissions.
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            CommandCentre-iOS26-v1.12.1.ipa

          echo "=== IPA contents ==="
          /usr/bin/unzip -l CommandCentre-iOS26-v1.12.1.ipa | head -n 100

          # Basic integrity test.
          /usr/bin/unzip -t CommandCentre-iOS26-v1.12.1.ipa

          echo
          echo "Created IPA:"
          ls -lh CommandCentre-iOS26-v1.12.1.ipa

    artifacts:
      - build/CommandCentre-iOS26-v1.12.1.ipa
      - build/ipa-structure-report.txt
      - build/xcodebuild-device.log
